name: Feature request
description: Suggest an improvement for Adaptive Climate.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: This request is specifically related to Adaptive Climate.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: I cannot currently...
    validations:
      required: true
  - type: textarea
    id: proposed_behaviour
    attributes:
      label: Proposed behaviour
      placeholder: Adaptive Climate should...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Feature area
      multiple: true
      options:
        - Comfort calculation
        - Active climate control
        - Occupancy and presence
        - Humidity and psychrometrics
        - Natural ventilation
        - Entities and dashboard UI
        - Configuration flow
        - Diagnostics and logging
        - Device or platform compatibility
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example Home Assistant setup or workflow
      placeholder: Describe the entities, devices, or automation involved.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds tried
